apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bsr
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - bsr.vlch.net
    secretName: bsr-tls
  rules:
  - host: bsr.vlch.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bsr
            port:
              number: 80
